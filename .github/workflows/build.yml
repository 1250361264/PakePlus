name: 'Publish and Deploy'

on:
    workflow_dispatch:
        inputs:
            build_macos_aarch64:
                description: 'Build for macOS aarch64'
                required: false
                type: boolean
                default: true
            build_macos_x86_64:
                description: 'Build for macOS x86_64'
                required: false
                type: boolean
                default: true
            build_linux_x86_64:
                description: 'Build for Linux x86_64'
                required: false
                type: boolean
                default: true
            build_linux_aarch64:
                description: 'Build for Linux aarch64'
                required: false
                type: boolean
                default: true
            build_windows_x86_64:
                description: 'Build for Windows x86_64'
                required: false
                type: boolean
                default: true
            build_windows_aarch64:
                description: 'Build for Windows aarch64'
                required: false
                type: boolean
                default: true

permissions:
    contents: write

concurrency:
    group: pages
    cancel-in-progress: false

jobs:
    publish-tauri:
        permissions:
            contents: write
        strategy:
            fail-fast: false
            matrix:
                include:
                    - platform: 'macos-latest'
                      target: 'aarch64-apple-darwin'
                      args: '--target aarch64-apple-darwin'
                      enabled: ${{ github.event.inputs.build_macos_aarch64 == 'true' }}
                    - platform: 'macos-latest'
                      target: 'x86_64-apple-darwin'
                      args: '--target x86_64-apple-darwin'
                      enabled: ${{ github.event.inputs.build_macos_x86_64 == 'true' }}
                    - platform: 'ubuntu-22.04'
                      target: 'x86_64-unknown-linux-gnu'
                      args: ''
                      enabled: ${{ github.event.inputs.build_linux_x86_64 == 'true' }}
                    - platform: 'ubuntu-22.04'
                      target: 'aarch64-unknown-linux-gnu'
                      args: ''
                      enabled: ${{ github.event.inputs.build_linux_aarch64 == 'true' }}
                    - platform: 'windows-latest'
                      target: 'x86_64-pc-windows-msvc'
                      args: ''
                      enabled: ${{ github.event.inputs.build_windows_x86_64 == 'true' }}
                    - platform: 'windows-latest'
                      target: 'aarch64-pc-windows-msvc'
                      args: '--target aarch64-pc-windows-msvc'
                      enabled: ${{ github.event.inputs.build_windows_aarch64 == 'true' }}

        runs-on: ${{ matrix.platform }}
        timeout-minutes: 60
        steps:
            - name: Checkout
              if: ${{ matrix.enabled }}
              uses: actions/checkout@v4

            - name: Install rust target
              if: ${{ matrix.enabled }}
              run: rustup target add ${{ matrix.target }}

            - uses: pnpm/action-setup@v4
              if: ${{ matrix.enabled }}
              with:
                  version: 10

            - name: Sync node version and setup cache
              if: ${{ matrix.enabled }}
              uses: actions/setup-node@v4
              with:
                  node-version: 24
                  cache: pnpm

            - name: Install Rust stable
              if: ${{ matrix.enabled }}
              uses: dtolnay/rust-toolchain@stable
              with:
                  targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

            - name: Install dependencies (ubuntu only)
              if: ${{ matrix.enabled && matrix.platform == 'ubuntu-22.04'}}
              run: |
                  sudo apt-get update
                  sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

            - name: Install frontend dependencies
              if: ${{ matrix.enabled }}
              run: pnpm install

            - name: Detect Apple signing config
              if: ${{ matrix.enabled && matrix.platform == 'macos-latest' }}
              id: apple_signing
              env:
                  APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
                  APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
                  KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
                  APPLE_ID: ${{ secrets.APPLE_ID }}
                  APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
                  APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
              run: |
                  missing=()
                  [ -z "$APPLE_CERTIFICATE" ] && missing+=(APPLE_CERTIFICATE)
                  [ -z "$APPLE_CERTIFICATE_PASSWORD" ] && missing+=(APPLE_CERTIFICATE_PASSWORD)
                  [ -z "$KEYCHAIN_PASSWORD" ] && missing+=(KEYCHAIN_PASSWORD)
                  [ -z "$APPLE_ID" ] && missing+=(APPLE_ID)
                  [ -z "$APPLE_PASSWORD" ] && missing+=(APPLE_PASSWORD)
                  [ -z "$APPLE_TEAM_ID" ] && missing+=(APPLE_TEAM_ID)
                  if [ ${#missing[@]} -eq 0 ]; then
                    echo "enabled=true" >> "$GITHUB_OUTPUT"
                  else
                    echo "enabled=false" >> "$GITHUB_OUTPUT"
                    echo "::warning::缺少 Apple 签名/公证 Secrets: ${missing[*]}。本次将构建未签名的 macOS 包；如需签名请在仓库 Settings > Secrets and variables > Actions 中补齐后再触发。"
                  fi

            - name: import Apple Developer Certificate
              if: ${{ matrix.enabled && matrix.platform == 'macos-latest' && steps.apple_signing.outputs.enabled == 'true' }}
              env:
                  APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
                  APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
                  KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
              run: |
                  echo "$APPLE_CERTIFICATE" | base64 --decode > certificate.p12
                  if [ ! -s certificate.p12 ]; then
                    echo "::error::APPLE_CERTIFICATE is invalid or empty after base64 decode."
                    exit 1
                  fi
                  security create-keychain -p "$KEYCHAIN_PASSWORD" build.keychain
                  security default-keychain -s build.keychain
                  security unlock-keychain -p "$KEYCHAIN_PASSWORD" build.keychain
                  security set-keychain-settings -t 3600 -u build.keychain
                  security import certificate.p12 -k build.keychain -P "$APPLE_CERTIFICATE_PASSWORD" -T /usr/bin/codesign
                  security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KEYCHAIN_PASSWORD" build.keychain
                  security find-identity -v -p codesigning build.keychain

            - name: verify certificate
              if: ${{ matrix.enabled && matrix.platform == 'macos-latest' && steps.apple_signing.outputs.enabled == 'true' }}
              run: |
                  CERT_INFO=$(security find-identity -v -p codesigning build.keychain | grep "Developer ID Application" || true)
                  if [ -z "$CERT_INFO" ]; then
                    echo "::error::钥匙串中未找到 Developer ID Application 证书，请检查 APPLE_CERTIFICATE 是否为正确的 p12（需包含私钥），以及 APPLE_CERTIFICATE_PASSWORD 是否正确。"
                    security find-identity -v -p codesigning build.keychain
                    exit 1
                  fi
                  CERT_ID=$(echo "$CERT_INFO" | head -n1 | awk -F'"' '{print $2}')
                  echo "CERT_ID=$CERT_ID" >> $GITHUB_ENV
                  echo "Certificate imported: $CERT_ID"

            - name: Build and release (Apple signed)
              if: ${{ matrix.enabled && steps.apple_signing.outputs.enabled == 'true' }}
              uses: tauri-apps/tauri-action@v0
              env:
                  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
                  APPLE_ID: ${{ secrets.APPLE_ID }}
                  APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
                  APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
                  APPLE_SIGNING_IDENTITY: ${{ env.CERT_ID }}
                  TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_PRIVATE_KEY }}
                  TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_KEY_PASSWORD }}
                  VITE_GITHUB_DOMAIN: ${{ secrets.VITE_GITHUB_DOMAIN }}
                  VITE_PAYJS_DOMAIN: ${{ secrets.VITE_PAYJS_DOMAIN }}
                  VITE_PAYJS_MCHID: ${{ secrets.VITE_PAYJS_MCHID }}
                  VITE_PAYJS_SIGN_KEY: ${{ secrets.VITE_PAYJS_SIGN_KEY }}
                  VITE_YUNPAY_DOMAIN: ${{ secrets.VITE_YUNPAY_DOMAIN }}
                  VITE_YUNPAY_MCHID: ${{ secrets.VITE_YUNPAY_MCHID }}
                  VITE_YUNPAY_SIGN_KEY: ${{ secrets.VITE_YUNPAY_SIGN_KEY }}
                  VITE_ZPAY_DOMAIN: ${{ secrets.VITE_ZPAY_DOMAIN }}
                  VITE_ZPAY_MCHID: ${{ secrets.VITE_ZPAY_MCHID }}
                  VITE_ZPAY_SIGN_KEY: ${{ secrets.VITE_ZPAY_SIGN_KEY }}
                  VITE_GTAG_ID: ${{ secrets.VITE_GTAG_ID }}
                  VITE_UPSTREAM_USER: ${{ secrets.VITE_UPSTREAM_USER }}
                  VITE_WEB_BRANCH: ${{ secrets.VITE_WEB_BRANCH }}
                  VITE_DEV_BRANCH: ${{ secrets.VITE_DEV_BRANCH }}
                  VITE_MAIN_BRANCH: ${{ secrets.VITE_MAIN_BRANCH }}
                  VITE_FILE_LIMIT_SIZE: ${{ secrets.VITE_FILE_LIMIT_SIZE }}
                  VITE_FILE_LIMIT_NUMBER: ${{ secrets.VITE_FILE_LIMIT_NUMBER }}
                  VITE_LOCAL_RHEXE: ${{ secrets.VITE_LOCAL_RHEXE }}
              with:
                  # Tag 必须等于构建分支名：服务端 PakeBuilderService 按分支名调用
                  # GET /releases/tags/{tag} 查找 Release
                  tagName: '${{ github.ref_name }}'
                  releaseName: '${{ github.ref_name }}'
                  releaseBody: 'Package for personal use only, please do not use for commercial purposes（打包仅限个人使用，请勿用于传播或商业用途）'
                  # 必须为 false：/releases/tags/{tag} 接口查不到草稿状态的 Release
                  releaseDraft: false
                  prerelease: false
                  args: ${{ matrix.args }}

            # 无签名模式：不导出任何 Apple 相关变量。
            # 注意：tauri-bundler 只要发现 APPLE_CERTIFICATE / APPLE_CERTIFICATE_PASSWORD
            # 变量存在（即使是空字符串），就会尝试导入证书；空值会导致
            # "SecKeychainItemImport: One or more parameters passed to a function were not valid."
            - name: Build and release (unsigned)
              if: ${{ matrix.enabled && steps.apple_signing.outputs.enabled != 'true' }}
              uses: tauri-apps/tauri-action@v0
              env:
                  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
                  TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_PRIVATE_KEY }}
                  TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_KEY_PASSWORD }}
                  VITE_GITHUB_DOMAIN: ${{ secrets.VITE_GITHUB_DOMAIN }}
                  VITE_PAYJS_DOMAIN: ${{ secrets.VITE_PAYJS_DOMAIN }}
                  VITE_PAYJS_MCHID: ${{ secrets.VITE_PAYJS_MCHID }}
                  VITE_PAYJS_SIGN_KEY: ${{ secrets.VITE_PAYJS_SIGN_KEY }}
                  VITE_YUNPAY_DOMAIN: ${{ secrets.VITE_YUNPAY_DOMAIN }}
                  VITE_YUNPAY_MCHID: ${{ secrets.VITE_YUNPAY_MCHID }}
                  VITE_YUNPAY_SIGN_KEY: ${{ secrets.VITE_YUNPAY_SIGN_KEY }}
                  VITE_ZPAY_DOMAIN: ${{ secrets.VITE_ZPAY_DOMAIN }}
                  VITE_ZPAY_MCHID: ${{ secrets.VITE_ZPAY_MCHID }}
                  VITE_ZPAY_SIGN_KEY: ${{ secrets.VITE_ZPAY_SIGN_KEY }}
                  VITE_GTAG_ID: ${{ secrets.VITE_GTAG_ID }}
                  VITE_UPSTREAM_USER: ${{ secrets.VITE_UPSTREAM_USER }}
                  VITE_WEB_BRANCH: ${{ secrets.VITE_WEB_BRANCH }}
                  VITE_DEV_BRANCH: ${{ secrets.VITE_DEV_BRANCH }}
                  VITE_MAIN_BRANCH: ${{ secrets.VITE_MAIN_BRANCH }}
                  VITE_FILE_LIMIT_SIZE: ${{ secrets.VITE_FILE_LIMIT_SIZE }}
                  VITE_FILE_LIMIT_NUMBER: ${{ secrets.VITE_FILE_LIMIT_NUMBER }}
                  VITE_LOCAL_RHEXE: ${{ secrets.VITE_LOCAL_RHEXE }}
              with:
                  # Tag 必须等于构建分支名：服务端 PakeBuilderService 按分支名调用
                  # GET /releases/tags/{tag} 查找 Release
                  tagName: '${{ github.ref_name }}'
                  releaseName: '${{ github.ref_name }}'
                  releaseBody: 'Package for personal use only, please do not use for commercial purposes（打包仅限个人使用，请勿用于传播或商业用途）'
                  # 必须为 false：/releases/tags/{tag} 接口查不到草稿状态的 Release
                  releaseDraft: false
                  prerelease: false
                  args: ${{ matrix.args }}

